    <!-- Git init: Inicializa um repositório Git em um diretório, transformando ele em um projeto com controle de versão 
         Git add: Adiciona arquivos ao índice (staging area) para serem incluídos no próximo commit
         Git commit: Ele é usado para salvar e rastrear alterações em uma base de código 

         Git add ., Git commit -m e Git push são comandos usados em sequência para salvar e enviar alterações de código para um repositório remoto.
    -->

          <!-- CSS → é a linguagem padrão de estilo para páginas web. Sintaxe simples, mas sem recursos avançados (ex.: variáveis, funções, aninhamento).
            SASS/SCSS → são pré-processadores de CSS. Eles adicionam recursos que o CSS puro não tem (variáveis, mixins, herança, nesting).
            SASS (indented syntax) → usa indentação em vez de {} e ;. Sintaxe mais "limpa", mas menos parecida com CSS.
            SCSS (Sassy CSS) → é a sintaxe mais usada hoje. Parece quase idêntica ao CSS, mas aceita todos os recursos do SASS.
        -->
